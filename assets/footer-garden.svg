<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="190" viewBox="0 0 1000 190" role="img" aria-labelledby="t d">
<title id="t">See you next season</title>
<desc id="d">Footer: an ASCII garden sways across four seasons while petals, seeds, leaves and snow drift down.</desc>
<defs><linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#0A141B"/><stop offset="1" stop-color="#0D1820"/></linearGradient></defs>
<style><![CDATA[
text{font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,"Liberation Mono",monospace;white-space:pre}
.sw{animation:sw 4s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
@keyframes sw{0%,100%{transform:rotate(-5deg)}50%{transform:rotate(5deg)}}
.fall{animation:fall linear infinite}
@keyframes fall{0%{transform:translate(0,-20px) rotate(0);opacity:0}10%{opacity:.9}90%{opacity:.7}100%{transform:translate(-60px,150px) rotate(220deg);opacity:0}}
.pulse{animation:pulse 3s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.55}50%{opacity:1}}
.cur{animation:blink 1s steps(2,start) infinite}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.fall{display:none}}
]]></style>
